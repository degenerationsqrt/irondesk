<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080b0f" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex,follow" />
    <meta
      name="description"
      content="IronDesk has moved to the current IronDesk Pro training intelligence app."
    />
    <link rel="canonical" href="https://irondeskpro.lovable.app/" />
    <title>Opening IronDesk Pro…</title>
    <script src="/irondesk/redirect.js" defer></script>
    <noscript>
      <meta
        http-equiv="refresh"
        content="0;url=https://irondeskpro.lovable.app/"
      />
    </noscript>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #080b0f;
        color: #f5f7fa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(
            circle at top,
            rgb(33 150 243 / 16%),
            transparent 38%
          ),
          #080b0f;
      }

      main {
        width: min(100%, 520px);
        padding: 36px;
        border: 1px solid #29313c;
        border-radius: 18px;
        background: rgb(17 22 29 / 94%);
        box-shadow: 0 24px 80px rgb(0 0 0 / 45%);
        text-align: center;
      }

      .brand {
        margin: 0 0 12px;
        font-size: clamp(1.65rem, 7vw, 2.35rem);
        font-weight: 850;
        letter-spacing: 0.22em;
      }

      .brand span {
        color: #2196f3;
      }

      p {
        margin: 0;
        color: #a9b4c2;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        justify-content: center;
        margin-top: 24px;
        padding: 12px 18px;
        border-radius: 10px;
        background: #2196f3;
        color: #06101a;
        font-weight: 750;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid #90caf9;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 class="brand">IRON<span>DESK</span></h1>
      <p>
        Opening the matching page in the current IronDesk Pro app. If the
        handoff does not start automatically, use the button below.
      </p>
      <a href="https://irondeskpro.lovable.app/">Open IronDesk Pro</a>
    </main>
  </body>
</html>
