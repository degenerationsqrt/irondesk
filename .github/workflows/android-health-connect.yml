name: Android Health Connect CI

on:
  push:
    paths:
      - "android-health-connect/**"
      - ".github/workflows/android-health-connect.yml"
  pull_request:
    paths:
      - "android-health-connect/**"
      - ".github/workflows/android-health-connect.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-health-connect-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test, and build unsigned beta
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Lint and unit test
        working-directory: android-health-connect
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace lintDebug testDebugUnitTest

      - name: Build debug smoke APK and unsigned release artifacts
        working-directory: android-health-connect
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease bundleRelease

      - name: Verify beta metadata and unsigned boundary
        working-directory: android-health-connect
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          aab="app/build/outputs/bundle/release/app-release.aab"
          test -f "$apk"
          test -f "$aab"

          badging="$($ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$apk")"
          grep -F "package: name='app.irondesk.health' versionCode='11001' versionName='1.1.0-beta.1'" <<<"$badging"
          grep -F "targetSdkVersion:'36'" <<<"$badging"

          if unzip -Z1 "$apk" | grep -Eq '^META-INF/[^/]+\.(RSA|DSA|EC)$'; then
            echo "Release APK unexpectedly contains a signing certificate." >&2
            exit 1
          fi
          if unzip -Z1 "$aab" | grep -Eq '^META-INF/[^/]+\.(RSA|DSA|EC)$'; then
            echo "Release AAB unexpectedly contains a signing certificate." >&2
            exit 1
          fi

          mkdir -p beta-artifacts
          cp "$apk" beta-artifacts/irondesk-health-1.1.0-beta.1-UNSIGNED.apk
          cp "$aab" beta-artifacts/irondesk-health-1.1.0-beta.1-UNSIGNED.aab
          (cd beta-artifacts && sha256sum * > SHA256SUMS.txt)
          printf '%s\n' \
            'NOT INSTALLABLE: CI verification artifacts are intentionally unsigned.' \
            'Create a signed APK for private testers or upload the signed AAB with Play App Signing.' \
            > beta-artifacts/DO-NOT-DISTRIBUTE-UNSIGNED.txt

      - name: Upload unsigned verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: irondesk-health-1.1.0-beta.1-unsigned
          path: android-health-connect/beta-artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: irondesk-health-reports
          path: |
            android-health-connect/app/build/reports/
            android-health-connect/app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
