name: Mobile Android Preview CI

on:
  push:
    paths:
      - "mobile-android/**"
      - "android-health-connect/gradle/wrapper/**"
      - "android-health-connect/gradlew"
      - ".github/workflows/mobile-android-preview.yml"
  pull_request:
    paths:
      - "mobile-android/**"
      - "android-health-connect/gradle/wrapper/**"
      - "android-health-connect/gradlew"
      - ".github/workflows/mobile-android-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate non-releaseable native preview
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Lint, test, and build debug preview
        working-directory: mobile-android
        run: |
          chmod +x gradlew ../android-health-connect/gradlew
          ./gradlew --no-daemon --stacktrace lintDebug testDebugUnitTest assembleDebug

      - name: Verify preview safety boundary
        working-directory: mobile-android
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"

          badging="$($ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$apk")"
          grep -F "package: name='app.irondesk.mobile.preview.debug'" <<<"$badging"
          grep -F "targetSdkVersion:'36'" <<<"$badging"

          permissions="$($ANDROID_HOME/build-tools/36.0.0/aapt dump permissions "$apk")"
          if grep -Fq "android.permission.INTERNET" <<<"$permissions"; then
            echo "Internal preview unexpectedly has network access." >&2
            exit 1
          fi

          if ./gradlew --no-daemon tasks --all | grep -Eq '^[[:space:]]*([^[:space:]]+:)*(assemble|bundle|package)Release([[:space:]]|$)'; then
            echo "Internal preview unexpectedly exposes a release artifact task." >&2
            exit 1
          fi

          if grep -R -E 'android\.webkit\.WebView|server[[:space:]]*\.[[:space:]]*url' app/src; then
            echo "Internal preview unexpectedly contains a web wrapper." >&2
            exit 1
          fi

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android-preview-reports
          path: |
            mobile-android/app/build/reports/
            mobile-android/app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
